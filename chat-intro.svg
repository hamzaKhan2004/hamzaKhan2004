<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 115" fill="none">
<style>
/* Base text styles */
.txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.w { opacity: 0; animation: wordReveal 0.02s ease-out forwards; }
.cursor { opacity: 0; fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }

@keyframes wordReveal {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

/* Line 1 Cursor */
@keyframes cur1 {
  0%, 10% { opacity: 0; }
  15%, 85% { opacity: 1; }
  90%, 100% { opacity: 0; }
}
.c1 { animation: cur1 0.23s steps(1) 0.04s forwards; }

/* Line 2 Cursor */
@keyframes cur2 {
  0%, 10% { opacity: 0; }
  15%, 85% { opacity: 1; }
  90%, 100% { opacity: 0; }
}
.c2 { animation: cur2 0.32s steps(1) 0.28s forwards; }

/* Line 3 Cursor (blinks and fades out at 1.85s) */
@keyframes cur3 {
  0% { opacity: 0; }
  10%, 25% { opacity: 1; }
  30%, 45% { opacity: 0; }
  50%, 65% { opacity: 1; }
  70%, 85% { opacity: 0; }
  90%, 98% { opacity: 1; }
  100% { opacity: 0; }
}
.c3 { animation: cur3 1.25s linear 0.60s forwards; }

/* Reduced motion fallback: show all text immediately without cursors */
@media (prefers-reduced-motion: reduce) {
  .w { opacity: 1 !important; animation: none !important; }
  .cursor { display: none !important; }
}
.w0 { animation-delay: 0.050s; }
.w1 { animation-delay: 0.088s; }
.w2 { animation-delay: 0.126s; }
.w3 { animation-delay: 0.164s; }
.w4 { animation-delay: 0.280s; }
.w5 { animation-delay: 0.318s; }
.w6 { animation-delay: 0.356s; }
.w7 { animation-delay: 0.394s; }
.w8 { animation-delay: 0.432s; }
.w9 { animation-delay: 0.470s; }
.w10 { animation-delay: 0.508s; }
.w11 { animation-delay: 0.630s; }
.w12 { animation-delay: 0.668s; }
.w13 { animation-delay: 0.706s; }
.w14 { animation-delay: 0.744s; }
.w15 { animation-delay: 0.782s; }
.w16 { animation-delay: 0.820s; }
.w17 { animation-delay: 0.858s; }
</style>
  <rect width="680" height="115" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="3.5" fill="#58a6ff"/>
  <text class="txt" x="30" y="21" font-size="10" font-weight="600" fill="#58a6ff" letter-spacing="0.5">HAMZA // INTRO</text>
  <text class="txt" x="20" y="42" font-size="15" font-weight="600" fill="#58a6ff" xml:space="preserve"><tspan class="w w0">Hi, </tspan><tspan class="w w1">I'm </tspan><tspan class="w w2">Hamza </tspan><tspan class="w w3">Khan. </tspan><tspan class="cursor c1">▎</tspan></text>
  <text class="txt" x="20" y="68" font-size="14" font-weight="400" fill="#e6edf3" xml:space="preserve"><tspan class="w w4">I </tspan><tspan class="w w5">build </tspan><tspan class="w w6">full-stack </tspan><tspan class="w w7">applications </tspan><tspan class="w w8">and </tspan><tspan class="w w9">AI-powered </tspan><tspan class="w w10">systems. </tspan><tspan class="cursor c2">▎</tspan></text>
  <text class="txt" x="20" y="94" font-size="14" font-weight="400" fill="#8b949e" xml:space="preserve"><tspan class="w w11">Currently </tspan><tspan class="w w12">exploring </tspan><tspan class="w w13">scalable </tspan><tspan class="w w14">backends </tspan><tspan class="w w15">and </tspan><tspan class="w w16">AI </tspan><tspan class="w w17">engineering. </tspan><tspan class="cursor c3">▎</tspan></text>
</svg>