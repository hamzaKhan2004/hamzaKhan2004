<svg
xmlns="http://www.w3.org/2000/svg"
width="520"
height="520"
viewBox="0 0 520 520">

<style>

.card {
    fill: #0d1117;
}

.border {
    fill: none;

    stroke: #30363d;

    stroke-width: 1;
}

.line {
    font-family: "DejaVu Sans Mono","Courier New",Consolas,monospace;

    opacity: 0;

    transform:
        translateX(-10px);

    animation:
        reveal
        0.4s
        ease-out
        forwards;
}

@keyframes reveal {

    0% {
        opacity: 0;

        transform:
            translateX(-10px);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0);
    }

}

</style>


